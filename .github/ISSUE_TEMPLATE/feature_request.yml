name: Feature Request
description: Suggest an idea or enhancement for Truedown Android
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please note that features such as Douyin, background audio playing, and custom SAF folders are currently out of scope for the MVP.

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem or Need
      description: Is your feature request related to a specific problem or pain point?
      placeholder: "A clear and concise description of what problem you're trying to solve..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or idea.
      placeholder: "A clear and concise description of what you want to happen..."
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?

  - type: checkboxes
    id: scope_check
    attributes:
      label: Scope Confirmation
      options:
        - label: I have reviewed the README and confirmed that this feature request aligns with the project scope.
          required: true
