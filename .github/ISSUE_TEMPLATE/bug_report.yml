name: Bug Report
description: Create a report to help improve Truedown Android
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the details below to help us reproduce and resolve the issue.
        :warning: **Never paste secrets, passwords, keystores, or private tokens anywhere in this form.**

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What area of the app does this issue relate to?
      options:
        - Download Failed / Error
        - Slideshow Photo Picker
        - Video Player
        - Audio Player
        - Library & File Management
        - Localization / Translations
        - UI & Appearance
        - Other
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version
      description: e.g., 1.0.0
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: apk_variant
    attributes:
      label: Installed APK Variant
      description: Which APK variant did you install?
      options:
        - arm64-v8a (64-bit)
        - armeabi-v7a (32-bit)
        - universal
        - Built from source
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: Device & OS Information
      description: Device model, RAM, and Android version (e.g., Infinix Hot 11 Play, 3GB RAM, Android 11)
      placeholder: "Samsung Galaxy A52, 6GB RAM, Android 13"
    validations:
      required: true

  - type: dropdown
    id: link_type
    attributes:
      label: Type of TikTok Post
      options:
        - Single Video
        - 1-Photo Slideshow
        - Multi-Photo Slideshow
        - Audio Only
        - Other / Not Applicable
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How did you encounter the problem?
      placeholder: |
        1. Open TikTok and share a video to Truedown (or paste a link).
        2. Tap on "Periksa link".
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen and what actually happened?
    validations:
      required: true

  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: Error Logs or Screenshots
      description: Paste any error messages or attach screenshots. (Please redact any private/sensitive info from URLs).

  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have verified that I am using the latest release version of the app.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have confirmed that no secrets, passwords, or sensitive personal data are included in this report.
          required: true
