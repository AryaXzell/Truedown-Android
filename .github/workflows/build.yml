name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        run: |
          test -f ./gradlew || {
            echo "::error::Gradle wrapper (./gradlew) is missing from the repository"
            exit 1
          }
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Prepare Signing Keystore
        id: prepare-keystore
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_DIR="/tmp/truedown_signing"
            mkdir -p "$KEYSTORE_DIR"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_DIR/release.keystore"
            echo "KEYSTORE_FILE=$KEYSTORE_DIR/release.keystore" >> $GITHUB_ENV
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APKs
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Log R8 Optimization & Shrinking Results
        run: |
          echo "=================================================="
          echo "         R8 OPTIMIZATION & SHRINKING REPORT       "
          echo "=================================================="
          MAPPING_DIR="app/build/outputs/mapping/release"
          
          if [ -d "$MAPPING_DIR" ]; then
            echo "R8 Output Directory: $MAPPING_DIR"
            ls -la "$MAPPING_DIR"
            
            if [ -f "$MAPPING_DIR/mapping.txt" ]; then
              MAPPING_LINES=$(wc -l < "$MAPPING_DIR/mapping.txt")
              echo "✓ R8 Minification is ACTIVE (mapping.txt has $MAPPING_LINES entries)."
            else
              echo "⚠ Warning: mapping.txt not found!"
            fi
            
            if [ -f "$MAPPING_DIR/usage.txt" ]; then
              DEAD_CODE_COUNT=$(wc -l < "$MAPPING_DIR/usage.txt")
              echo "✓ Dead code eliminated by R8: $DEAD_CODE_COUNT unused classes/methods removed (usage.txt)."
            fi
            
            if [ -f "$MAPPING_DIR/seeds.txt" ]; then
              SEEDS_COUNT=$(wc -l < "$MAPPING_DIR/seeds.txt")
              echo "✓ Preserved entry points (-keep rules): $SEEDS_COUNT items in seeds.txt."
            fi
          else
            echo "⚠ Warning: R8 mapping folder was not generated at $MAPPING_DIR"
          fi
          echo "=================================================="

      - name: Verify APK Signatures & Inspect ABI Contents
        run: |
          APK_DIR="app/build/outputs/apk/release"
          echo "=== Inspecting Built APKs ==="
          ls -la "$APK_DIR"/*.apk

          ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          for apk in "$APK_DIR"/*.apk; do
            echo "--------------------------------------------------"
            echo "Inspecting: $(basename "$apk") (Size: $(du -h "$apk" | cut -f1))"
            echo "Contents of lib/:"
            unzip -l "$apk" | grep "lib/" || echo "No native libraries in lib/"

            if [ "${{ steps.prepare-keystore.outputs.has_keystore }}" = "true" ]; then
              echo "Verifying signature with apksigner:"
              "$APKSIGNER" verify --verbose --print-certs "$apk" || {
                echo "ERROR: apksigner verification failed for $apk"
                exit 1
              }
            else
              echo "Unsigned / Debug-signed build. Skipping strict apksigner verification."
            fi
          done

      - name: Generate SHA-256 Checksums
        run: |
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done
          echo "Generated SHA-256 checksums:"
          cat *.sha256

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -rf /tmp/truedown_signing
          rm -f /tmp/release.keystore

      - name: Upload arm64-v8a (64-bit) APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: truedown-arm64-v8a
          path: |
            app/build/outputs/apk/release/*-arm64-v8a.apk
            app/build/outputs/apk/release/*-arm64-v8a.apk.sha256
          retention-days: 14

      - name: Upload armeabi-v7a (32-bit) APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: truedown-armeabi-v7a
          path: |
            app/build/outputs/apk/release/*-armeabi-v7a.apk
            app/build/outputs/apk/release/*-armeabi-v7a.apk.sha256
          retention-days: 14

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: truedown-universal
          path: |
            app/build/outputs/apk/release/*-universal.apk
            app/build/outputs/apk/release/*-universal.apk.sha256
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-test')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download arm64-v8a Artifacts
        uses: actions/download-artifact@v4
        with:
          name: truedown-arm64-v8a
          path: release-assets

      - name: Download armeabi-v7a Artifacts
        uses: actions/download-artifact@v4
        with:
          name: truedown-armeabi-v7a
          path: release-assets

      - name: Download Universal Artifacts
        uses: actions/download-artifact@v4
        with:
          name: truedown-universal
          path: release-assets

      - name: Extract Tag & Version
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract section for current release if possible
            echo "Release notes extracted from CHANGELOG.md"
          fi
          cat << 'EOF' > release_body.md
          ### Truedown Android Release

          Download the APK matching your device architecture:
          - **`arm64-v8a`**: Recommended for all modern 64-bit Android devices.
          - **`armeabi-v7a`**: For older 32-bit Android devices.
          - **`universal`**: Compatible with all supported devices (larger download size).

          #### Verify Checksums:
          Verify your download using the provided `.sha256` checksum files:
          ```bash
          sha256sum -c truedown-<version>-<abi>.apk.sha256
          ```

          ---
          *Review CHANGELOG.md for full list of changes in this version.*
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag_name }}" \
            release-assets/*.apk \
            release-assets/*.sha256 \
            --title "Truedown Android ${{ steps.version.outputs.tag_name }}" \
            --notes-file release_body.md
